# Tuna behind Caddy (automatic HTTPS).
# Copy this folder's files to the server, create .env from
# .env.example, then: docker compose pull && docker compose up -d
services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tuna

  tuna:
    image: ghcr.io/diabeatz96/tuna:latest
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "56000-56100:56000-56100/udp"
    volumes:
      - ./media:/home/neko/Downloads
      # Keeps logins (Crunchyroll, Plex, YouTube) across restarts.
      # Must be owned by uid 1000: mkdir -p profile && chown 1000:1000 profile
      - ./profile:/home/neko/.config/brave
    environment:
      NEKO_DESKTOP_SCREEN: "1920x1080@30"
      NEKO_WEBRTC_EPR: "56000-56100"
      NEKO_WEBRTC_NAT1TO1: "${PUBLIC_IP}"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "${TUNA_USER_PASSWORD}"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "${TUNA_ADMIN_PASSWORD}"

volumes:
  caddy_data:
  caddy_config:
